services:
  - type: web
    name: smailo-bot
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: API_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: LOG_CHAT_ID
        value: -1003862800881
      - key: PAYMENT_NOTIFY_CHAT_ID
        value: -1003862800881
      - key: SUPPORT_CONTACT
        value: "@qcryptopay"
      - key: PROXY_URL
        value: ""
