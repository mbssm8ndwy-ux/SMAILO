<!DOCTYPE html>
<html>
<head>
    <title>SkittlesMarket — актуальные ссылки и контакты</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0d0d0d;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(ellipse at 30% 20%, rgba(88, 166, 255, 0.08) 0%, transparent 60%),
                              radial-gradient(ellipse at 70% 80%, rgba(255, 88, 255, 0.06) 0%, transparent 60%);
        }
        #wrapper {
            max-width: 520px;
            width: 100%;
            padding: 40px 24px;
            text-align: center;
        }
        .logo {
            width: 96px;
            height: 96px;
            margin: 0 auto 32px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(4px);
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ff6b9d, #c44dff, #6e8efb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.45);
            margin-bottom: 40px;
            line-height: 1.6;
            word-break: break-word;
        }
        .subtitle a {
            color: rgba(255,255,255,0.55);
            text-decoration: none;
            transition: color 0.2s;
        }
        .subtitle a:hover { color: #fff; }
        nav { display: flex; flex-direction: column; gap: 14px; }
        nav a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            background: rgba(255,255,255,0.06);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.25s;
            letter-spacing: 0.02em;
        }
        nav a:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        nav a .icon { margin-right: 10px; font-size: 20px; }
        .footer {
            margin-top: 48px;
            font-size: 12px;
            color: rgba(255,255,255,0.25);
        }
        .footer span { display: inline-block; margin: 0 8px; }
        @media (max-width: 480px) {
            #wrapper { padding: 28px 16px; }
            h1 { font-size: 18px; }
            .logo { width: 72px; height: 72px; font-size: 30px; }
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <div class="logo">🍬</div>
        <h1>SkittlesMarket</h1>
        <p class="subtitle">
            skittlesmarket.online &nbsp;·&nbsp; skittles.bot
        </p>
        <nav>
            <a href="https://t.me/Skittles_Market_bot"><span class="icon">🤖</span>Skittles Market Bot</a>
            <a href="https://t.me/qcryptopay"><span class="icon">💬</span>Поддержка</a>
        </nav>
        <div class="footer">
            <span>© SkittlesMarket</span>
        </div>
    </div>
</body>
</html>
